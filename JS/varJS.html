<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
</head>
<body>
    <script>
        // JS Variables.-- contains eihter value or not...

        var myName="Ankur";

        document.write(myName);
        console.log(myName);

        var myName="Rohit";      //Accept both Redeclare and reassign
        console.log(myName);


        function demo(){
            var msg="Hello ABES";
            console.log(msg);
        }
        demo();

        let myNumber=9625340387;
        console.log(myNumber);

        myNumber=4534894892;     // no redeclare but reassign
        console.log(myNumber);

        const myEmail="tushar6160@gmail.com";
        console.log(myEmail);
        myEmail="tushar6160@gmail.com"; // no redeclare and no reassign
        console.log(myEmail);
        // JS Execution
        // JS Scope
        // Variable declaration
        // Difference among var , let and const
    </script>
</body>
</html>
